# Custom EPSG overrides for this project.
# GeoServer loads this at startup (FactoryUsingWKT). Restart required after edit.
#
# 5181: project convention = Korea 2000 / Central Belt (false northing 500000).
# Official EPSG:5181 is Unified CS (FN 600000); our layers/SHP use FN 500000 under code 5181.
# Without this entry GeoServer throws: NoSuchAuthorityCodeException EPSG:5181
# → FeatureType create fails with "layer srs seems to be mis-configured".
5181=PROJCS["Korea 2000 / Central Belt",GEOGCS["Korea 2000",DATUM["Geocentric_datum_of_Korea",SPHEROID["GRS 1980",6378137.0,298.257222101],TOWGS84[0,0,0,0,0,0,0]],PRIMEM["Greenwich",0.0],UNIT["degree",0.017453292519943295]],PROJECTION["Transverse_Mercator"],PARAMETER["latitude_of_origin",38.0],PARAMETER["central_meridian",127.0],PARAMETER["scale_factor",1.0],PARAMETER["false_easting",200000.0],PARAMETER["false_northing",500000.0],UNIT["metre",1.0],AUTHORITY["EPSG","5181"]]
