# pg_featureserv 설정 파일
# PostgreSQL 연결 정보
# 주의: DATABASE_URL 환경 변수가 설정되어 있으면 환경 변수를 우선 사용합니다.
# .env.local의 DB 정보는 실행 스크립트에서 DATABASE_URL로 변환되어 사용됩니다.
[Database]
# 아래 값들은 DATABASE_URL 환경 변수가 없을 때만 사용됩니다.
Host = "192.168.120.82"
Port = 5433
Database = "postgres"
User = "postgres"
Password = "postgres"

# 서버 설정
[Server]
HttpHost = "0.0.0.0"
HttpPort = 9000
UrlScheme = "http"
UrlHost = "192.168.120.82:9000"
CorsAllowedOrigins = ["*"]

# 로깅
[Logging]
Level = "info"
